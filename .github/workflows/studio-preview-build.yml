name: Publish Customer App Studio Preview
on:
  push:
    branches: [refactor/code-audit]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: customer-app-studio-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/code-audit
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: current-site
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: source
        run: flutter pub get --enforce-lockfile
      - name: Build customer preview
        working-directory: source
        run: flutter build web --target=lib/main_preview.dart --base-href=/cofee-resturant-new-app/preview/ --output=build/studio-preview-package/preview --no-pub
      - name: Prepare complete Pages site
        shell: bash
        run: |
          mkdir -p site
          cp -a current-site/admin site/admin
          if [ -f current-site/index.html ]; then cp current-site/index.html site/index.html; fi
          cp -a source/build/studio-preview-package/preview site/preview
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4

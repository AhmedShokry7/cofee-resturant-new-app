name: Build isolated Studio Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run preview isolation tests
        run: flutter test test/studio_preview_isolation_test.dart --no-pub

      - name: Build the isolated preview package
        run: >-
          flutter build web
          --target=lib/main_preview.dart
          --base-href=/cofee-resturant-new-app/preview/
          --output=build/studio-preview-package/preview
          --no-pub

      - name: Verify static site package
        shell: bash
        run: |
          test -s build/studio-preview-package/preview/index.html
          grep -F '<base href="/cofee-resturant-new-app/preview/">' build/studio-preview-package/preview/index.html
          test -d build/studio-preview-package/preview/assets
          test -s build/studio-preview-package/preview/flutter_bootstrap.js
          test -s build/studio-preview-package/preview/main.dart.js

      - name: Upload build artifact (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-studio-preview
          path: build/studio-preview-package/
          if-no-files-found: error
          retention-days: 14

# across drive roots, which kills incremental caches for android_file_picker
# and image_picker_android. Compiling Kotlin inside the Gradle daemon removes
# the cross-drive relativization entirely, so the daemon strategy is disabled.
# The Pub cache lives on C:\ while this project lives on D:\. Kotlin's
# incremental-compilation cache relativizes source and cache paths against its
# working directory and throws "IllegalArgumentException: this and base files
# have different roots" across Windows drive roots, which leaves the caches
# unclosed and fails android_file_picker and image_picker_android.
# Incremental compilation is disabled until Kotlin/KGP relativizes cross-drive
# paths; full (non-incremental) compilation is used instead.
kotlin.incremental=false

android.newDsl=false

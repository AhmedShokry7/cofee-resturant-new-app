name: admin_app
description: "Separate Flutter Web admin application for the coffee platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.6
  path_provider_windows: ^2.3.0
  supabase_flutter: ^2.10.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  hugeicons: ^0.0.11
  flutter_svg: ^2.3.0
  cached_network_image: ^4.0.4
  image_picker: ^1.2.4
  image: ^4.12.0
  webview_windows: ^0.4.0
  http: ^1.6.0
  flutter_quill: ^11.6.0
  file_picker: ^13.1.0
  archive: ^4.0.7
  xml: ^7.0.1
  syncfusion_flutter_xlsio: ^35.1.42
  universal_html: ^2.3.0
  flutter_map: ^8.3.2
  geolocator: ^14.0.1
  latlong2: ^0.10.1
  fl_chart: ^0.69.0
  printing: ^5.14.0
  pdf: ^3.13.1
  web: ^1.1.0
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.4
  flutter_colorpicker: ^1.1.0
  github: ^9.4.0
  flutter_treeview: ^1.0.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/

  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

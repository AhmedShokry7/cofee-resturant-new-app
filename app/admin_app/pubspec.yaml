name: admin_app
description: "Separate Flutter Web admin application for the coffee platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.10.0
  flutter_bloc: ^9.1.1
  # الحالات والأحداث في فيتشر Auth تقارن بالقيمة (sealed + Equatable)،
  # وده يمنع إعادة بناء الواجهة لما الحالة تفضل زي ما هي.
  equatable: ^2.0.7
  hugeicons: ^0.0.11
  flutter_svg: ^2.3.0
  # The pictures of the catalogue come from the database and are shown again
  # and again, so they are cached on the device instead of being fetched
  # every time a card is drawn.
  cached_network_image: ^4.0.4
  # The admin picks the pictures of a product from the device. The customer
  # application already uses this picker, so the platform is proven.
  image_picker: ^1.2.4
  # The editor of a picture crops and rotates the real file, not only the
  # preview. The processing runs in Dart, so it works on the web too.
  image: ^4.12.0
  # The editor reads the file of a picture to cut it. The package is already in
  # the tree of the Supabase client, so it costs nothing extra.
  http: ^1.6.0
  flutter_quill: ^11.6.0
  file_picker: ^13.1.0
  archive: ^4.0.7
  xml: ^7.0.1
  syncfusion_flutter_xlsio: ^35.1.42
  universal_html: ^2.3.0
  flutter_map: ^8.3.2
  geolocator: ^14.0.1
  latlong2: ^0.10.1
  fl_chart: ^0.69.0
  # الطباعة كانت تعمل في المتصفح فقط لأن المستند كان HTML داخل إطار مخفي.
  # هذان الحزمتان ترسمان المستند PDFًا وتسلمانه لنافذة طباعة النظام على
  # ويندوز وماك ولينكس، وللمعاينة على أندرويد وiOS، وللطباعة على الويب،
  # فالمسار واحد على كل جهاز بلا أي إطار مخفي أو js-interop.
  printing: ^5.14.0
  pdf: ^3.13.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # A generator run from the command line (`dart run flutter_launcher_icons`,
  # configured by flutter_launcher_icons.yaml) that writes the launcher icons.
  # Nothing in `lib/` imports it, so it stays out of the shipped set.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/

  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
